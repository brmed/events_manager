# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py310-django{30}

[testenv]
commands = {envpython} runtests.py {posargs}
deps =
    django30: Django==4.2.27
    py310-django{30}: mock
    py310-django{30}: ipdb
    py310-django{30}: coverage
    py310-django{30}: model-bakery
    py310-django{30}: typing
    py310-django{30}: attrs
    py310-django{30}: psycopg2-binary
    py310-django{30}: python-dateutil
    py310-django30: django-discover-runner